name: NolQu-L Alpha release

'on':
  workflow_dispatch:
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: nolqu-l-alpha-release
  cancel-in-progress: false

jobs:
  publish-alpha:
    if: github.repository == 'NolQuDev/NolQu-L' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Package, verify and publish the qualified Alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B .github/scripts/alpha_release.py

      - name: Preserve publication output even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nolqu-l-alpha-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/nolqu-l-alpha-assets
